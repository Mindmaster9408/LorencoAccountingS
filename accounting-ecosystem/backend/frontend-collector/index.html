<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Collector — Lorenco</title>
<link rel="stylesheet" href="/collector/css/collector.css">
</head>
<body>
    <div class="app-header">
        <div>
            <div class="app-title">Smart Client Document Collector</div>
            <div class="app-subtitle">Staff console</div>
        </div>
        <a href="/dashboard" class="btn btn-sm">&larr; Ecosystem</a>
    </div>
    <div class="layout">
        <div class="sidebar">
            <div class="row" style="justify-content:space-between;margin-bottom:12px;">
                <strong>Clients</strong>
                <button class="btn btn-sm" id="newClientBtn">+ New</button>
            </div>
            <div id="clientList"></div>
        </div>
        <div class="main" id="main">
            <div class="empty-state">Select a client, or create a new one.</div>
        </div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="/collector/js/api.js"></script>
    <script src="/collector/js/app.js"></script>
</body>
</html>
